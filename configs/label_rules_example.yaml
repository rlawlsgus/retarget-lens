# 자동 라벨 예시 규칙 (retlens.autolabel). 인스펙터 > 라벨 > 규칙 파일...에서 고른다.
# 고쳐 쓰려면 저장소 밖(예: 문서 폴더)에 복사해서 고친다. 프로젝트의 실제 라벨 정의는 이 저장소에 넣지 않는다
# (사용 설명서 '자동 라벨'; configs/의 다른 label_rules* 파일은 .gitignore가 막는다).
#
# 형식: retlens/autolabel/rules.py 머리말. 쓸 수 있는 트랙과 값: retlens/autolabel/segment.py 머리말
#   이동 · 회전 · 자세 · 자세전환 · 왼손 · 오른손 · 손 · 양손 · 걸음
# 레인마다 위에서부터 처음 맞는 규칙이 그 프레임의 라벨이 된다.

name: 예시 (기본 동작)

tracks:
  - track: 동작
    min_seg: 0.3                 # 0.3 s보다 짧은 조각은 더 긴 이웃에 합친다
    rules:
      - {label: 점프, when: {이동: 점프}}
      - {label: 달리기, when: {이동: 달리기}}
      - {label: 들고 걷기, when: {이동: [걷기, 계단 오르기, 계단 내리기], 양손: 들기}}
      - {label: 걷기, when: {이동: [걷기, 계단 오르기, 계단 내리기]}}
      - {label: 앉기·일어서기, when: {자세전환: [앉기, 일어서기]}}
      # 몸을 낮춘 뒤 0.5 s 안에 손을 뻗으면 그 낮추기도 손 뻗기
      - {label: 손 뻗기, when: {자세전환: 낮추기}, then: {손: [뻗기, 작업]}, within: 0.5}
      - {label: 손 뻗기, when: {손: 뻗기}}
      - {label: 손 쓰기, name: 팔을 내민 채 있음, when: {손: 작업}}
      - {label: 들고 있기, when: {양손: 들기}}
      - {label: 앉아 있기, when: {자세: 앉음}}
      - {label: 서 있기}         # when이 없으면 남은 모든 프레임

  # 엔진이 찾은 트랙을 그대로 보이는 레인 (규칙을 만들 때 참고용). skip의 값은 비워 둔다
  - {track: 이동, axis: 이동, skip: [정지]}
  - {track: 왼손, axis: 왼손, skip: [휴지]}
  - {track: 오른손, axis: 오른손, skip: [휴지]}
